<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gépjármű-nyilvántartás</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
  <div class="container">
    <h1 style="text-align: center">Gépjármű-nyilvántartás</h1>
    <div class="card mb-2">
      <div class="card-body">
        <h5 class="card-title mb-3">Új gépjármű felvétele</h5>
        <form id="gepjarmuForm" class="row">
          <div class="col-md-3">
            <input type="text" id="rendszam" class="form-control" placeholder="Rendszám (AAA-001)" required />
          </div>
          <div class="col-md-3">
            <input type="text" id="marka" class="form-control" placeholder="Márka (Suzuki Swift)" required />
          </div>
          <div class="col-md-3">
            <input type="number" id="evjarat" class="form-control" placeholder="Évjárat (2003)" required />
          </div>
          <div class="col-md-3">
            <div class="form-control">
              <p style="display: inline">Műszaki érvényesség</p>
              <input type="checkbox" id="muszakiE" />
            </div>
          </div>
          <div class="col-md-12">
            <button type="submit" class="btn btn-secondary w-100">
              Felvétel
            </button>
          </div>
        </form>
      </div>
    </div>
    <div class="col-sm-4">
      <label for="rendezes" class="form-label">Rendezés évjárat szerint:</label>
      <select id="rendezes" class="form-select">
        <option value="asc">Növekvő sorrend</option>
        <option value="desc">Csökkenő sorrend</option>
      </select>
    </div>
    <div class="table">
      <table class="table table-striped table-hover">
        <thead class="table-dark">
          <tr>
            <th>Rendszám</th>
            <th>Márka</th>
            <th>Évjárat</th>
            <th>Műszaki érvényesség</th>
            <th>Művelet</th>
          </tr>
        </thead>
        <tbody id="gepjarmuTablaBody"></tbody>
      </table>
    </div>
    <footer class="text-center" style="color: grey">
      Aktuális dátum: <span id="aktualisDatum"></span>
    </footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
